<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<style>
    :root {
        --page-bg: {{page_bg}};
        --card-bg: {{card_bg}};
        --text: {{text}};
        --muted: {{muted}};
        --border: {{border}};
        --accent: {{accent}};
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 32px;
        background: var(--page-bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .card {
        width: min(520px, 100%);
        padding: 34px 36px 32px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card-bg);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
        text-align: center;
    }

    .status-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        margin-bottom: 18px;
        border: 2px solid var(--accent);
        border-radius: 50%;
        color: var(--accent);
        font-size: 26px;
        font-weight: 600;
        line-height: 1;
    }

    h1 {
        margin: 0;
        color: var(--text);
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.01em;
    }

    .message {
        margin: 14px 0 0;
        color: var(--text);
        font-size: 14px;
        line-height: 1.55;
    }

    .detail {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
    }
</style>
</head>
<body>
    <main class="card" role="status" aria-live="polite">
        <div class="status-icon" aria-hidden="true">!</div>
        <h1>{{title}}</h1>
        <p class="message">{{message}}</p>
        <p class="detail">{{detail}}</p>
    </main>
</body>
</html>
