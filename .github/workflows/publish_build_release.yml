name: Publish build release

on:
  pull_request:
    paths:
      - '.github/workflows/publish_build_release.yml'

  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Build all run ID to publish'
        required: true
        type: string
      release_tag:
        description: 'Release tag to create or update'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  register:
    name: Register workflow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Register workflow
        run: true

  publish:
    name: Publish build release
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      REPO: ${{ github.repository }}

    steps:
      - name: Check build run
        shell: bash
        run: |
          conclusion=$(gh run view "$RUN_ID" --repo "$REPO" --json conclusion --jq .conclusion)
          if [ "$conclusion" != "success" ]; then
            echo "Build run $RUN_ID conclusion is '$conclusion', expected 'success'." >&2
            exit 1
          fi

          head_sha=$(gh run view "$RUN_ID" --repo "$REPO" --json headSha --jq .headSha)
          run_url=$(gh run view "$RUN_ID" --repo "$REPO" --json url --jq .url)
          echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=SpoolEase-BambuStudio ${{ inputs.release_tag }}" >> "$GITHUB_ENV"
          echo "RELEASE_TARGET=$head_sha" >> "$GITHUB_ENV"
          echo "RUN_URL=$run_url" >> "$GITHUB_ENV"

      - name: Download release artifacts
        shell: bash
        run: |
          gh run download "$RUN_ID" \
            --repo "$REPO" \
            --dir artifacts \
            --pattern 'BambuStudio_Windows_*_portable' \
            --pattern 'BambuStudio_Mac_arm64_*' \
            --pattern 'BambuStudio_ubuntu-22.04_*' \
            --pattern 'BambuStudio_ubuntu-24.04_*'

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release unpack/mac dmg-root

          windows_zip=$(find artifacts -type f -name 'BambuStudio_Windows_*_portable.zip' -print -quit)
          if [ -z "$windows_zip" ]; then
            echo "Could not find Windows portable zip in downloaded artifacts." >&2
            exit 1
          fi
          cp "$windows_zip" "release/SE_$(basename "$windows_zip")"

          mac_zip=$(find artifacts -type f -name 'BambuStudio_Mac_arm64_*.zip' -print -quit)
          if [ -z "$mac_zip" ]; then
            echo "Could not find macOS build zip in downloaded artifacts." >&2
            exit 1
          fi

          unzip -q "$mac_zip" -d unpack/mac
          mac_app=$(find unpack/mac -type d -path '*/build/universal/BambuStudio/BambuStudio.app' -print -quit)
          if [ -z "$mac_app" ]; then
            echo "Could not find universal BambuStudio.app inside macOS artifact." >&2
            exit 1
          fi

          ditto "$mac_app" dmg-root/BambuStudio.app
          ln -s /Applications dmg-root/Applications

          mac_version=$(basename "$mac_zip" .zip | sed 's/^BambuStudio_Mac_arm64_//')
          hdiutil create \
            -volname BambuStudio \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "release/SE_BambuStudio_Mac_universal_${mac_version}.dmg"

          linux_2204=$(find artifacts -type f -name 'Bambu_Studio_ubuntu-22.04_*.AppImage' -print -quit)
          if [ -z "$linux_2204" ]; then
            echo "Could not find Ubuntu 22.04 AppImage in downloaded artifacts." >&2
            exit 1
          fi
          cp "$linux_2204" "release/SE_$(basename "$linux_2204")"

          linux_2404=$(find artifacts -type f -name 'Bambu_Studio_ubuntu-24.04_*.AppImage' -print -quit)
          if [ -z "$linux_2404" ]; then
            echo "Could not find Ubuntu 24.04 AppImage in downloaded artifacts." >&2
            exit 1
          fi
          cp "$linux_2404" "release/SE_$(basename "$linux_2404")"

          ls -lh release

      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          Build artifacts from [GitHub Actions run $RUN_ID]($RUN_URL).

          Download notes:
          - Expand the Assets section below.
          - Download the appropriate file for your operating system.

          Installation notes:
          - macOS: open the DMG and copy BambuStudio.app to Applications.
          - Windows: extract the portable zip and run bambu-studio.exe from the extracted folder.
          - Linux: download the AppImage matching your Ubuntu version, make it executable with chmod +x, then run it.
          - If the AppImage does not start and reports a FUSE/libfuse error, install libfuse2.

          Bypassing unsigned app warnings:
          - On macOS and Windows, you may need to bypass protection for unsigned apps.
          - Try the instructions at: https://github.com/daltonmenezes/electron-app/blob/main/docs/UNSIGNED_APPS.md
          - If those do not work, try: https://github.com/yanshay/SpoolEase/releases/tag/SpoolEase-Desktop-r0.1.0
          EOF

          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            is_prerelease=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json isPrerelease --jq .isPrerelease)
            if [ "$is_prerelease" != "true" ]; then
              echo "Release $RELEASE_TAG already exists and is not a prerelease." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release/* --repo "$REPO" --clobber
          else
            tag_sha=$(gh api "repos/$REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null || true)
            if [ -n "$tag_sha" ]; then
              if [ "$tag_sha" != "$RELEASE_TARGET" ]; then
                echo "Release tag $RELEASE_TAG already points to $tag_sha, but build run $RUN_ID produced $RELEASE_TARGET." >&2
                echo "Refusing to publish mismatched release." >&2
                exit 1
              fi
              gh release create "$RELEASE_TAG" release/* \
                --repo "$REPO" \
                --verify-tag \
                --title "$RELEASE_NAME" \
                --notes-file release-notes.md \
                --prerelease
            else
              gh release create "$RELEASE_TAG" release/* \
                --repo "$REPO" \
                --target "$RELEASE_TARGET" \
                --title "$RELEASE_NAME" \
                --notes-file release-notes.md \
                --prerelease
            fi
          fi
